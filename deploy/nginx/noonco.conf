# /etc/nginx/sites-available/noonco
# HTTPS(443) 블록은 `sudo certbot --nginx -d api.mingu.cloud` 실행 시 certbot 이 자동으로 추가한다.
server {
    listen 80;
    server_name api.mingu.cloud;

    # 업로드 제한(파일 5MB, 요청 6MB)보다 크게 둬야 앱이 413 을 직접 응답한다
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 해설 스트림(NDJSON)이 청크 단위로 바로 전달되도록 버퍼링·압축을 끈다
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 120s;
    }
}
