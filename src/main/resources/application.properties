spring.application.name=noonco

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

llm.provider=${LLM_PROVIDER:fake}
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
llm.gemini.temperature=${GEMINI_TEMPERATURE:1.0}
llm.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:4096}
llm.gemini.timeout=${GEMINI_TIMEOUT:60s}
llm.gemini.retry-attempts=${GEMINI_RETRY_ATTEMPTS:2}
llm.fake.chunk-delay=${LLM_FAKE_CHUNK_DELAY:100ms}
# 해설 스트림(비동기 응답) 제한 시간. 분석 제한 시간(GEMINI_TIMEOUT)보다 길어야 한다
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT:90s}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:14d}

spring.jpa.open-in-view=false

# 쉼표로 여러 개 지정 (예: http://localhost:5173,https://noonco.example.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# 크기 초과 요청의 남은 본문을 Tomcat 이 읽어 버릴 수 있어야 413 응답이 클라이언트에 전달된다
server.tomcat.max-swallow-size=10MB

# 업로드 파일 저장 폴더 (상대 경로는 실행 위치 기준)
file.storage-dir=${FILE_STORAGE_DIR:./data/files}
